<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Puffs 2026 Cast</title>
  <style>
    :root{--ink:#2d2418;--paper:#f4eccf;--paper-deep:#e7d7a8;--mustard:#d2a51f;--brown:#6b4b24;--green:#52623b;--shadow:rgba(45,36,24,.18)}
    *{box-sizing:border-box}
    html{background:#362819}
    body{margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 20% 0,#fff8df 0,transparent 35%),linear-gradient(135deg,var(--paper),#eadbb4);min-height:100vh}
    header{padding:clamp(2rem,6vw,5rem) clamp(1rem,5vw,5rem) 2rem;border-bottom:8px solid var(--mustard);background:rgba(244,236,207,.8)}
    h1{margin:0;font-size:clamp(2.8rem,8vw,7rem);line-height:.9;letter-spacing:-.055em;text-transform:uppercase}
    .intro{max-width:950px;margin:1.5rem 0 0;font-size:clamp(1.05rem,2vw,1.4rem);line-height:1.5}
    main{display:grid;place-items:start;width:min(1500px,94vw);margin:0 auto;padding:clamp(2rem,5vw,5rem) 0 8rem}
    .cast-card{width:min(720px,100%);padding:clamp(1.5rem,4vw,3rem);background:rgba(255,250,230,.6);border:3px solid var(--brown);box-shadow:7px 8px 0 var(--shadow)}
    h2{margin:0 0 1rem;font-size:clamp(1.8rem,4vw,3.4rem);line-height:1.05}
    p{margin:.35rem 0 0;line-height:1.5}
    .drive-link{display:inline-block;margin:1.5rem 0 0;padding:.9rem 1.1rem;color:var(--paper);background:var(--brown);font:700 .9rem/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;border:2px solid var(--brown);box-shadow:4px 5px 0 var(--shadow);transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease,color .15s ease}
    .drive-link:hover,.drive-link:focus-visible{color:var(--ink);background:var(--mustard);transform:translate(-2px,-2px);box-shadow:7px 8px 0 var(--shadow)}
    @media(max-width:560px){header{border-bottom-width:5px}.cast-card{border-width:2px;box-shadow:4px 5px 0 var(--shadow)}}
  </style>
</head>
<body>
  <header>
    <h1>Puffs 2026</h1>
    <p class="intro">Welcome, cast! This is our home for the resources we’ll use as we bring this ridiculous and heartwarming story to life together.</p>
  </header>
  <main>
    <section class="cast-card" aria-labelledby="cast-resources-title">
      <h2 id="cast-resources-title">Cast Resources</h2>
      <p>Find the latest shared files and production materials in our cast folder.</p>
      <a class="drive-link" href="https://drive.google.com/drive/folders/1mqZgtz2kPDe678QekRyaJdDXzWyVboay?usp=sharing" target="_blank" rel="noopener">Open Cast Google Drive</a>
    </section>
  </main>
</body>
</html>
